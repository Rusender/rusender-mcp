name: Mirror to GitVerse

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout полной истории
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Отправить в GitVerse
        env:
          GITVERSE_USER: ${{ secrets.GITVERSE_USER }}
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
        run: |
          git push --force \
            "https://${GITVERSE_USER}:${GITVERSE_TOKEN}@gitverse.ru/rusender/rusender-mcp.git" \
            HEAD:master
