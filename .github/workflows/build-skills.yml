name: Build skill archives

on:
  push:
    branches: [master]
    paths:
      - "skills/**"
  pull_request:
    paths:
      - "skills/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Установить PyYAML
        run: pip install --quiet pyyaml

      - name: Проверить навыки
        run: bash scripts/check-skills.sh

  build:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Собрать архивы
        run: |
          mkdir -p dist
          for d in skills/*/; do
            name=$(basename "$d")
            [ "$name" = "all" ] && continue
            [ -f "$d/SKILL.md" ] || { echo "пропущен $name — нет SKILL.md"; continue; }
            (cd skills && zip -qr "../dist/$name.zip" "$name" -x "*.DS_Store")
            echo "собран $name.zip"
          done
          echo "---"
          ls -lh dist

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: skills-latest
          name: Навыки RuSender
          body: |
            Архивы навыков, собранные автоматически из ветки master.
            Ссылки постоянные и всегда отдают актуальную версию.

            Обновлено: ${{ github.run_started_at }}
          files: dist/*.zip
          make_latest: false

      - name: Напомнить, что обновить руками
        run: |
          REL="https://github.com/${{ github.repository }}/releases/download/skills-latest"
          {
            echo "## Архивы пересобраны"
            echo ""
            echo "| Навык | Ссылка |"
            echo "|---|---|"
            for f in dist/*.zip; do
              n=$(basename "$f" .zip)
              echo "| \`$n\` | [$n.zip]($REL/$n.zip) |"
            done
            echo ""
            echo "## Что обновить руками"
            echo ""
            echo "Архивы и релиз обновились сами. Остальное нужно поправить вручную:"
            echo ""
            echo "- [ ] Таблица в \`README.md\`"
            echo "- [ ] Таблица и версия в \`skills/README.md\`"
            echo "- [ ] Запись в \`CHANGELOG.md\`"
            echo "- [ ] Карточка на [странице MCP](https://rusender.ru/features/email/mcp/)"
            echo "- [ ] Карточка в [каталоге навыков](https://rusender.ru/features/email/mcp/skills-catalog/)"
            echo "- [ ] Страница инструкции на сайте"
            echo "- [ ] Строка в [таблице учёта](https://docs.google.com/spreadsheets/d/1HYOxvS10hlYmnEZWfax7JvJk0dgOQIJTbXEkbSc2GAs/edit)"
            echo "- [ ] Re-scan в [Cursor Directory](https://cursor.directory/plugins/rusender)"
            echo ""
            echo "Если переименовали папку — ссылки на сайте, в каталоге и в таблице учёта"
            echo "сломались, их надо поменять."
            echo ""
            echo "Полный регламент: [docs/skills-workflow.md](https://github.com/${{ github.repository }}/blob/master/docs/skills-workflow.md)"
          } >> "$GITHUB_STEP_SUMMARY"
